<!doctype html><html lang="ja"><meta charset="utf-8"><style>body{font:14px sans-serif;width:360px;padding:12px}button,textarea,input{width:100%;box-sizing:border-box;margin:6px 0;padding:8px}pre{white-space:pre-wrap;max-height:220px;overflow:auto}small{color:#555}</style><h3>Zero Agent Chrome Controller</h3><small>APIキーはこのポップアップ内だけで保持され、保存されません。</small><input id="apiKey" type="password" autocomplete="off" placeholder="OpenRouter API Key"><input id="model" value="google/gemini-2.5-flash" placeholder="OpenRouterモデルID"><textarea id="goal" rows="3" placeholder="AIへの指示（例：このページのリリース一覧を探して）"></textarea><button id="plan">AIに次の操作を提案させる</button><pre id="proposal"></pre><button id="execute" disabled>提案した操作を承認して実行</button><hr><button id="inspect">ページを解析</button><input id="selector" placeholder="CSSセレクター（例: button）"><input id="value" placeholder="入力する文字"><button id="click">選択した要素をクリック</button><button id="type">選択した要素に入力</button><button id="scroll">下にスクロール</button><pre id="result"></pre><script src="popup.js"></script></html>
